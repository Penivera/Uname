[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "uname-resolver"
version = "0.1.0"
description = "Universal Name (.uni) cross-chain domain resolver SDK for Python"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-2.0-only" }
authors = [
    { name = "Penivera" }
]
dependencies = [
    "httpx>=0.25.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
